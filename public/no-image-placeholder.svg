<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0d1117"/>
  <!-- Scanlines & Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)" />
  
  <!-- Outer retro border -->
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Center Box -->
  <rect x="260" y="140" width="280" height="170" fill="#161b22" stroke="#22c55e" stroke-width="3"/>

  <!-- Icon: Camera / Image with slash -->
  <g transform="translate(376, 175)" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="6" width="48" height="34" rx="2"/>
    <circle cx="24" cy="23" r="8"/>
    <path d="M 14 6 L 18 0 L 30 0 L 34 6"/>
    <line x1="-4" y1="-2" x2="52" y2="44" stroke="#ef4444" stroke-width="3"/>
  </g>

  <!-- Retro Text -->
  <text x="400" y="265" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#22c55e" letter-spacing="2">
    [ NO IMAGE AVAILABLE ]
  </text>
  <text x="400" y="288" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8b949e" letter-spacing="1">
    PREVIEW NOT YET UPLOADED
  </text>
</svg>

